[project]
name = "flowmine"
version = "0.2.0"
description = "Edge/cloud data validation and SensorThings-EPANET integration for water distribution systems, on simulated data"
authors = [{ name = "Syed Tahir Hussan" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "networkx>=3.0",
    "numpy>=2.5.5",
    "paho-mqtt>=2.2.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "six>=1.17.0",
    "uvicorn>=0.54.0",
    "wntr>=1.5.0",
]

[project.urls]
Homepage = "https://syedtahirhussan.github.io/wds-edge-cloud/"
Repository = "https://github.com/SyedTahirHussan/wds-edge-cloud"

[project.scripts]
flowmine = "flowmine.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = ["N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/flowmine/edge/core/*" = ["UP", "SIM", "RUF005", "B", "N"]
"tests/micropython/*" = ["UP", "SIM", "B", "N", "E402"]

[tool.mypy]
python_version = "3.12"
files = ["src/flowmine"]
exclude = ["src/flowmine/edge/core/"]
strict = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "flowmine.edge.core.*"
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "frost: contract tests against a running FROST-Server (skipped when unreachable)",
  "slow: tests that run a multi-week simulation",
]

[tool.coverage.run]
source = ["flowmine"]
omit = ["src/flowmine/dashboard/*", "src/flowmine/cli.py"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]
