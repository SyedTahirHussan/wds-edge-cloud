name: pages

# Builds the project page from the committed results and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build_site.py"
      - "results/**"
      - "docs/img/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install Python 3.12 and dependencies
        run: |
          uv python install 3.12
          uv sync --frozen
      - name: Build the page data from results/raw
        run: make site
      - name: The committed page data must match the results
        run: git diff --exit-code site/data.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
